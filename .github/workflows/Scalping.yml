name: Adaptive Scalping Bot

on:
  workflow_dispatch:

  schedule:
    # Every 5 minutes
    # Avoid minute 0 because GitHub warns that
    # high-load periods can delay scheduled jobs.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: adaptive-scalping
  cancel-in-progress: true

jobs:

  scalping:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Adaptive Scalping Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Save bot memory
        run: |
          git config user.name "adaptive-scalping-bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No memory changes."
          else
            git commit -m "Update adaptive scalping memory"
            git push
          fi
