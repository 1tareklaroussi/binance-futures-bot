name: Adaptive Scalping Bot

on:
  workflow_dispatch:

  schedule:
    # كل 5 دقائق
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scalping:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2️⃣ إعداد Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ تثبيت المكتبات
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # 4️⃣ تشغيل البوت
      - name: Run Adaptive Scalping Bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      # 5️⃣ حفظ ذاكرة البوت
      - name: Save bot learning data
        run: |
          git config --global user.name "Adaptive Scalping Bot"
          git config --global user.email "actions@github.com"

          git add data/trades.json data/model.json

          git diff --cached --quiet || git commit -m "Update bot learning data"

          git push
