import requests

urls = [
    "https://fapi.binance.com/fapi/v1/time",
    "https://fapi.binance.com/fapi/v1/exchangeInfo",
]

for url in urls:
    try:
        r = requests.get(url, timeout=15)
        print(url)
        print("STATUS:", r.status_code)
        print(r.text[:500])
    except Exception as e:
        print("ERROR:", e)
